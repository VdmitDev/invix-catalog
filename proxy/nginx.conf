resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /telegram/webhook {
        set $bot_upstream bot;
        proxy_pass http://$bot_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location ^~ /catalog/ {
        set $minio_upstream minio;
        proxy_pass http://$minio_upstream:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /docs {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        set $api_upstream api;
        proxy_pass http://$api_upstream:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        set $web_upstream web;
        proxy_pass http://$web_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
